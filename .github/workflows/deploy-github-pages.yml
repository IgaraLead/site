# Builds the Vite app and moves the ./dist contents to the root
# of the gh-pages branch (single-commit deploy history, no third-party action).
# In GitHub: Settings → Pages → Build and deployment → Source: Branch → gh-pages / (root).
# The custom domain is preserved via public/CNAME, which Vite copies into dist/.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Move dist contents to gh-pages root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf .
          cp -a dist/. .
          rm -rf dist
          git add -A
          git commit -m "Deploy ${{ github.sha }}" --allow-empty
          git push --force origin gh-pages
